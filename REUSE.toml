version = 1

# When several annotations match a file, the last one wins.

[[annotations]]
path = [".github/**", ".gitignore", ".gitattributes", ".editorconfig", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Vabax and VabaxOS contributors"
SPDX-License-Identifier = "CC0-1.0"

# Code: build configuration, packages, scripts, tests and CI workflows (ADR-0011).
[[annotations]]
path = [".github/workflows/**", "image/**", "packages/**", "scripts/**", "tests/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Vabax and VabaxOS contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Documentation.
[[annotations]]
path = ["**/*.md", "docs/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Vabax and VabaxOS contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Files copied from live-build (Debian), GPL-3.0-or-later, see image/README.md.
[[annotations]]
path = [
  "image/config/hooks/normal/*reproducible*.hook.chroot",
  "image/config/hooks/normal/*cleanup*.hook.chroot",
  "image/config/bootloaders/grub-pc/config.cfg",
  "image/config/bootloaders/grub-pc/live-theme/theme.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "2006-2025 The Debian Live team and live-build contributors",
  "2026 Vabax and VabaxOS contributors",
]
SPDX-License-Identifier = "GPL-3.0-or-later"

# Name and logo: reserved trademark (ADR-0011), see LICENSES/LicenseRef-VabaxOS-Trademark.txt.
[[annotations]]
path = ["artwork/logo-*", "image/config/bootloaders/splash.svg", "packages/vabaxos-branding/root/**/vabaxos-logo*.svg", "packages/vabaxos-branding/root/usr/share/backgrounds/vabaxos/*.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Vabax"
SPDX-License-Identifier = "LicenseRef-VabaxOS-Trademark"

# Vocabulary of the Kokoro model (hexgrad/Kokoro-82M), ADR-0019.
[[annotations]]
path = "packages/vabaxos-voice/root/usr/share/vabaxos/kokoro/vocab.json"
precedence = "override"
SPDX-FileCopyrightText = "2024-2025 hexgrad"
SPDX-License-Identifier = "Apache-2.0"

# VabaxOS system sounds, generated by scripts/lib/make-sounds.py.
[[annotations]]
path = "packages/vabaxos-sounds/root/usr/share/sounds/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Vabax and VabaxOS contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# GRUB fonts made from Atkinson Hyperlegible Next (OFL, no Reserved Font Name).
[[annotations]]
path = "image/config/bootloaders/grub-pc/live-theme/*.pf2"
precedence = "override"
SPDX-FileCopyrightText = "2020-2024 The Atkinson Hyperlegible Next Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# The VabaxOS sound theme: one strike of Yaru's bell.oga (Ubuntu), transposed.
[[annotations]]
path = ["artwork/sounds/yaru-bell.oga", "artwork/sounds/yaru-trash-empty.oga", "packages/vabaxos-sounds/root/usr/share/sounds/vabaxos/stereo/*.oga"]
precedence = "override"
SPDX-FileCopyrightText = ["2018 Mads Rosendahl", "2026 Vabax and VabaxOS contributors"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Screen capture sound of the freedesktop theme.
[[annotations]]
path = ["artwork/sounds/freedesktop-screen-capture.oga", "packages/vabaxos-sounds/root/usr/share/sounds/vabaxos/stereo/screen-capture.oga"]
precedence = "override"
SPDX-FileCopyrightText = "freesound user horsthorstensen"
SPDX-License-Identifier = "CC-BY-SA-3.0"
