# VabaxOS (ADR-0003, ADR-0014, block 16), for the installed system's
# boot menu, as in the live system's:
# - two beeps when the menu is ready;
# - no submenu: the recovery mode is the second entry (Down arrow, Enter);
# - recovery mode with voice: a menu read by console speech
#   (vabaxos-recovery.service) instead of a root password prompt.
GRUB_INIT_TUNE="960 440 1 0 4 440 1"
GRUB_DISABLE_SUBMENU=y
GRUB_CMDLINE_LINUX_RECOVERY="vabaxos.recovery vabaxos.voice=on systemd.unit=multi-user.target"
