# VabaxOS: speech-dispatcher plays speech through PipeWire's own interface
# (spd_pipewire, in speech-dispatcher-audio-plugins), not through its
# PulseAudio one, with the stream marked as the Accessibility role
# (ADR-0026).
#
# Why: with the PulseAudio output, speech-dispatcher waits for the end of
# each message by polling the server with no time limit (pulse.c,
# spd_pa_simple_drain); in the tests of tests/upstream/speechd-reply-race.py
# it stopped there, while the PipeWire output ran 200 rounds and 2000
# messages without a stall (with the fix of patches/debian/speech-dispatcher).
# The upstream configuration names PipeWire as the output it wants to make
# the default.
#
# Read at the end of speechd.conf (Include "clients/*.conf"). To go back to
# the PulseAudio output, delete this file and restart speech-dispatcher.
AudioOutputMethod "pipewire"
