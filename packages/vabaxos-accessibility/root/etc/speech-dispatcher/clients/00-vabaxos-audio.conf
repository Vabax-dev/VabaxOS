# VabaxOS: speech-dispatcher plays speech through PipeWire's own interface
# (spd_pipewire, speech-dispatcher 0.12), not through its PulseAudio one,
# with the stream marked as the Accessibility role.
#
# Why (CI of block 15, 2026-09-26): with the PulseAudio output, speech-
# dispatcher sometimes stopped passing messages to its modules. It queued
# every message of Orca, sent "stop" again and again, and nothing was said
# until it was restarted, while a sound played straight on PipeWire was
# heard. Its PulseAudio output waits for the end of each message by polling
# the server with no time limit (pulse.c, spd_pa_simple_drain). The
# upstream configuration names PipeWire as the output it wants to make the
# default.
#
# Read at the end of speechd.conf (Include "clients/*.conf"). To go back to
# the PulseAudio output, delete this file and restart speech-dispatcher.
AudioOutputMethod "pipewire"
