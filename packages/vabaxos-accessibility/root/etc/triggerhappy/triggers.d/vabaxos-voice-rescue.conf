# VabaxOS: Ctrl+Super+Enter brings the voice back (block 16), from the
# desktop, the login screen or a text console, even when GNOME Shell is
# frozen: triggerhappy reads the keyboard below the desktop. Its commands
# run as nobody, so it only asks: vabaxos-voice-rescue.path starts
# /usr/libexec/vabaxos/voice-rescue as root.
# triggerhappy wants exactly these keys held (no Shift, no Alt): one line
# for each Ctrl, each Super and each Enter.
KEY_ENTER+KEY_LEFTCTRL+KEY_LEFTMETA     1 /usr/bin/touch /run/vabaxos-voice-rescue/request
KEY_ENTER+KEY_RIGHTCTRL+KEY_LEFTMETA    1 /usr/bin/touch /run/vabaxos-voice-rescue/request
KEY_ENTER+KEY_LEFTCTRL+KEY_RIGHTMETA    1 /usr/bin/touch /run/vabaxos-voice-rescue/request
KEY_ENTER+KEY_RIGHTCTRL+KEY_RIGHTMETA   1 /usr/bin/touch /run/vabaxos-voice-rescue/request
KEY_KPENTER+KEY_LEFTCTRL+KEY_LEFTMETA   1 /usr/bin/touch /run/vabaxos-voice-rescue/request
KEY_KPENTER+KEY_RIGHTCTRL+KEY_LEFTMETA  1 /usr/bin/touch /run/vabaxos-voice-rescue/request
KEY_KPENTER+KEY_LEFTCTRL+KEY_RIGHTMETA  1 /usr/bin/touch /run/vabaxos-voice-rescue/request
KEY_KPENTER+KEY_RIGHTCTRL+KEY_RIGHTMETA 1 /usr/bin/touch /run/vabaxos-voice-rescue/request
