# VabaxOS: the brlapi group of BRLTTY. Debian's brltty lets the user of the
# active session use the braille display through polkit
# (org.a11y.brlapi.write-display) and its polkit rule also allows the
# members of brlapi, but Debian creates no such group. VabaxOS creates it,
# so the live user (live-config) and the user created by the installer
# (passwd/user-default-groups) are in it, as the Debian accessibility wiki
# advises for Orca.
g brlapi -
