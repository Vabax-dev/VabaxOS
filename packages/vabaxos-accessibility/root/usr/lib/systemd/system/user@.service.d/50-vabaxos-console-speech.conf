# VabaxOS: console speech follows the user's sound session.
# espeakup speaks through the PulseAudio socket of the user's PipeWire
# (/usr/libexec/vabaxos/espeakup-start). When a user manager starts, its
# socket is ready: restart espeakup so it connects to it; when it stops,
# restart espeakup again so it lets go of the old socket. "+": as root;
# user@.service runs its commands as the user, who may not restart system
# services ("Access denied", found by test-install.sh on 2026-09-25).
[Service]
ExecStartPost=-+/usr/bin/systemctl --no-block try-restart espeakup.service
ExecStopPost=-+/usr/bin/systemctl --no-block try-restart espeakup.service
