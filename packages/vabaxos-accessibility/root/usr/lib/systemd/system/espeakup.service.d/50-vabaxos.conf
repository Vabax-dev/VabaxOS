# VabaxOS: console speech (ADR-0005, ADR-0014).
[Unit]
# "Without voice" in the boot menu passes vabaxos.voice=off.
ConditionKernelCommandLine=!vabaxos.voice=off
# live-config writes the language chosen in the boot menu.
After=live-config.service

[Service]
# Choose the eSpeak NG voice from the system language.
ExecStart=
ExecStart=/usr/libexec/vabaxos/espeakup-start
