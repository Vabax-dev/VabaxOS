# VabaxOS: Orca without the X11 display (ADR-0005, ADR-0017).
# With DISPLAY set, every time Orca sets up its modifier keys it reads the
# keyboard map through Xwayland with xkbcomp, and writes it back, clearing
# Caps Lock when Caps Lock is an Orca modifier (the NVDA scheme, block 10).
# GNOME Shell then reloads its key bindings, and sometimes freezes for
# good at startup (2026-09-26: main thread waiting, right after the
# reload). Under Wayland the xkbcomp work is not needed: Mutter itself
# holds back the first press of the screen reader's modifier keys (its
# a11y manager), so Insert and Caps Lock still work in every program.
[Service]
UnsetEnvironment=DISPLAY
