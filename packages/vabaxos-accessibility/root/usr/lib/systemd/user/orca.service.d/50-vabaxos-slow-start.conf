# VabaxOS: Orca on slow computers (block 14).
# Orca tells systemd it is ready only when it has started, and systemd
# kills it after 90 seconds (the default): in a slow virtual machine Orca
# needed longer, was killed three times and stayed silent for six minutes
# (2026-09-26). A slow start is better than no speech.
# WatchdogSec=6 of Orca's unit killed it whenever its main loop waited
# longer, for example on a slow Speech Dispatcher loading Kokoro; each kill
# means a silent restart. 30 seconds still restarts an Orca that hangs.
[Service]
TimeoutStartSec=5min
WatchdogSec=30
