# VabaxOS: keep the sound card awake (ADR-0005, ADR-0014).
# By default WirePlumber suspends an idle output after a few seconds. For a
# screen reader user that can cut the first syllables of speech, and after a
# switch to the text console the speech of Speakup could be lost. Idea from
# the Fenrir screen reader (tools/configure_pipewire.sh), rewritten for
# WirePlumber 0.5.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
