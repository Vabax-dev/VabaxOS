# Desktop voice of VabaxOS (ADR-0019, ADR-0022), read by
# vabaxos-voice-select at boot.
#
# engine: espeak (the default, Vabax's choice) uses eSpeak NG; users choose
# Kokoro for themselves in the first setup. kokoro always uses Kokoro, auto
# measures the computer and uses Kokoro if it is fast enough.
engine=espeak
# With engine=auto: the longest acceptable delay, in milliseconds, for a
# new short phrase.
max_delay_ms=800
# With engine=auto: less memory than this (in MB) keeps eSpeak NG.
min_memory_mb=7000
