# Desktop voice of VabaxOS (ADR-0019), read by vabaxos-voice-select at boot.
#
# engine: auto measures the computer and uses Kokoro if it is fast enough,
# kokoro always uses Kokoro, espeak always uses eSpeak NG.
engine=auto
# The longest acceptable delay, in milliseconds, for a new short phrase.
# Provisional value: it will be set by listening to Orca.
max_delay_ms=800
# Less memory than this (in MB) keeps eSpeak NG.
min_memory_mb=7000
