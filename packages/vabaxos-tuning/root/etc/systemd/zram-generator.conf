# VabaxOS: compressed memory instead of the disk when memory runs short
# (zram, as Fedora and Ubuntu do). A computer that swaps to the disk
# freezes for seconds, and the screen reader with it; compressed memory is
# many times faster. Half of the memory, at most 4 GB, compressed with
# zstd (the values of systemd-zram-generator's documentation and of the
# Arch wiki). Used before any swap partition (priority 100).
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
