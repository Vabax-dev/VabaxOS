# VabaxOS: compressed memory instead of the disk when memory runs short
# (zram, as Fedora and Ubuntu do). A computer that swaps to the disk
# freezes for seconds, and the screen reader with it; compressed memory is
# many times faster. Debian's /etc/systemd/zram-generator.conf already
# gives half of the memory, at most 4 GB; this drop-in, read after it,
# adds zstd compression and puts zram before any swap partition.
[zram0]
compression-algorithm = zstd
swap-priority = 100
