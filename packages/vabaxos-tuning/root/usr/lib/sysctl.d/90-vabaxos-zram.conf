# VabaxOS: memory settings for zram (vabaxos-tuning). Swapping to
# compressed memory costs little, so the kernel may do it earlier
# (swappiness above 100, as the kernel documentation allows for in-memory
# swap and the Arch wiki advises for zram); one page at a time, since zram
# has no seek time; no extra reclaim when memory is fragmented.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
