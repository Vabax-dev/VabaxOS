# The voice that asks the password of an encrypted disk at boot
# (vabaxos-unlock, ADR-0021). After a change: sudo update-initramfs -u
#
# ENABLE=no keeps Debian's silent prompt.
ENABLE=yes
# Other words for the messages, if wanted (in the language of the system):
# MSG_ASK="Type the password of the disk, then press Enter."
# MSG_WRONG="Wrong password. Try again."
# MSG_OPEN="Disk open. VabaxOS is starting."
