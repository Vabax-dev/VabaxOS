# VabaxOS: at shutdown, wait at most 10 seconds for the programs of the
# user session instead of 90. With Orca on, the live system sometimes
# waited 90 seconds in silence before powering off (2026-09-24, cause not
# found yet: see docs/utente/benvenuto.md, known issues).
[Manager]
DefaultTimeoutStopSec=10s
