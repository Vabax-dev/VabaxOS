# VabaxOS: Orca's settings of VabaxOS (the NVDA keys, typing echo as NVDA)
# written for the user before Orca starts. Orca 50 reads only the values a
# user set, not the system defaults in /etc/dconf/db/vabaxos.d, so they are
# copied once for every key the user has not changed (block 14,
# 2026-09-26). A failure does not stop Orca.
[Service]
ExecStartPre=-/usr/lib/vabaxos-screen-reader/orca-defaults
