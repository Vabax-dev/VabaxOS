# VabaxOS build settings, read by auto/config and scripts/build.sh (ADR-0002).
# Shell syntax: KEY=value, no spaces around '='.

# Debian release the ISO is built from: testing "forky" for the 0.x series
# (ADR-0017, which partly replaces ADR-0001).
VABAXOS_DISTRIBUTION=forky

# Every package comes from snapshot.debian.org at this moment (UTC).
# Change it on purpose, in its own commit, to pick up Debian updates.
# 2026-10-04: Debian testing with Orca 51 (in testing since 2026-10-02,
# ADR-0031) and still GNOME Shell 50; before, 2026-09-24 (kernel 7.2.6,
# which the Debian Installer built from git expects).
VABAXOS_SNAPSHOT=20261004T000000Z
