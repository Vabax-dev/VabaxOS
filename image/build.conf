# VabaxOS build settings, read by auto/config and scripts/build.sh (ADR-0002).
# Shell syntax: KEY=value, no spaces around '='.

# Debian release the ISO is built from: Debian 13 "trixie" stable, with its
# security and updates archives (ADR-0001, ADR-0027).
VABAXOS_DISTRIBUTION=trixie

# The next version of VabaxOS (ADR-0015). The VabaxOS packages of builds
# that are not a release take it with the date of the last commit
# (scripts/build-packages.sh); a release sets VABAXOS_VERSION to it. After
# a release, move it to the next one in the commit after the tag.
VABAXOS_NEXT_VERSION=0.1.0-alpha.1

# Every package comes from snapshot.debian.org at this moment (UTC).
# Change it on purpose, in its own commit, to pick up Debian updates.
# The same moment for the security archive (snapshot.debian.org/archive/
# debian-security). 2026-09-26: Debian 13.7 with the updates of that week.
VABAXOS_SNAPSHOT=20260926T000000Z

# The last date above chosen for a security fix (ADR-0020), or empty. The
# daily check of vabaxos-update tells the user about a security update when
# the VabaxOS archive has a date moved for security newer than theirs.
VABAXOS_SECURITY_SNAPSHOT=
