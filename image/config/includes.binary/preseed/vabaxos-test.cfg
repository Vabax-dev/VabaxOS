# Automatic installation for the VabaxOS tests (scripts/test-install.sh).
# Used only when the installer is started with
# preseed/file=/cdrom/preseed/vabaxos-test.cfg: never from the boot menu.
# It ERASES the first virtio disk (/dev/vda) of the test virtual machine.
# The test user and password are public on purpose: test machines only.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/enable boolean false
d-i netcfg/get_hostname string vabaxos-test
d-i netcfg/get_domain string
d-i hw-detect/load_firmware boolean false
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Rome
d-i clock-setup/ntp boolean false

d-i passwd/root-login boolean false
d-i passwd/user-fullname string VabaxOS test
d-i passwd/username string vabax
d-i passwd/user-password password test
d-i passwd/user-password-again password test
d-i user-setup/allow-password-weak boolean true

d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

# The VM forgets its UEFI boot entries between runs: install GRUB also in
# the removable path (\EFI\BOOT\BOOTX64.EFI), which every firmware tries.
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true
# The tests log in on the serial console.
d-i debian-installer/add-kernel-opts string console=tty0 console=ttyS0,115200n8

popularity-contest popularity-contest/participate boolean false
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
