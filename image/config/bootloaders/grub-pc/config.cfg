# VabaxOS: copy of live-build's bootloaders/grub-pc/config.cfg
# (live-build 20250505, GPL-3.0-or-later), with a boot timeout added.
# The full speaking boot menu comes with ADR-0014 (v0.1, work item 4).

set default=0
# Start the default entry by itself after 10 seconds (ADR-0014).
set timeout=10

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1
