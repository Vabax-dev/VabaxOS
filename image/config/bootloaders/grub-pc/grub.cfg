# VabaxOS boot menu (ADR-0014, ADR-0016), for UEFI and BIOS.
# Replaces live-build's grub.cfg; live-build fills in the @...@ markers.
#
# Accessibility: config.cfg plays two beeps when the menu is ready.
# Every entry has a letter (hotkey) that starts it at once, so the menu
# can be used without seeing it. Without a key press, the first entry
# starts after the timeout set in config.cfg. The keys are described in
# docs/utente/menu-di-avvio.md: keep the two in sync.
#
# Language: the menu is in English, as in other distributions. The
# Language entry (L) reloads this file in the chosen language; the two
# beeps play again to confirm. The chosen language is passed to the live
# system (live-config: locales, keyboard-layouts; VabaxOS: vabaxos.lang),
# so the welcome, the voice and the desktop use it too. The letters are
# the same in every language.
#
# vabaxos.voice=on|off is read by the live system to start the speech
# (console and desktop) or not.

source /boot/grub/config.cfg

if [ -z "${vabaxos_lang}" ]; then
	set vabaxos_lang=en
	set vabaxos_lang_params=""
fi

if [ "${vabaxos_lang}" = "it" ]; then
	set t_voice="VabaxOS con voce  (V)"
	set t_novoice="VabaxOS senza voce  (N)"
	set t_recovery="Modalità di recupero con voce  (R)"
	set t_language="Lingua: italiano  (L)"
	set t_tools="Strumenti  (T)"
	set t_check="Verifica il supporto di avvio  (C)"
	set t_safe="Grafica sicura  (G)"
	set t_next="Avvia dal dispositivo successivo  (D)"
	set t_firmware="Impostazioni del firmware UEFI  (F)"
	set t_reboot="Riavvia  (R)"
	set t_halt="Spegni  (S)"
else
	set t_voice="VabaxOS with voice  (V)"
	set t_novoice="VabaxOS without voice  (N)"
	set t_recovery="Recovery mode with voice  (R)"
	set t_language="Language: English  (L)"
	set t_tools="Tools  (T)"
	set t_check="Check the boot medium  (C)"
	set t_safe="Safe graphics  (G)"
	set t_next="Boot from the next device  (D)"
	set t_firmware="UEFI firmware settings  (F)"
	set t_reboot="Reboot  (R)"
	set t_halt="Shut down  (S)"
fi
# Menu entries and submenus run in their own context: export what they use.
export vabaxos_lang vabaxos_lang_params
export t_check t_safe t_next t_firmware t_reboot t_halt

menuentry "${t_voice}" --hotkey=v --id=vabaxos-voice {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ vabaxos.voice=on ${vabaxos_lang_params}
	initrd	@INITRD_LIVE@
}

menuentry "${t_novoice}" --hotkey=n --id=vabaxos-novoice {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ vabaxos.voice=off ${vabaxos_lang_params}
	initrd	@INITRD_LIVE@
}

# Recovery: text console only, no graphical session, speech on.
menuentry "${t_recovery}" --hotkey=r --id=vabaxos-recovery {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ vabaxos.voice=on systemd.unit=multi-user.target ${vabaxos_lang_params}
	initrd	@INITRD_LIVE@
}

# Each language is written in its own language.
submenu "${t_language}" --hotkey=l --id=vabaxos-language {
	source /boot/grub/theme.cfg

	menuentry "English  (E)" --hotkey=e {
		set vabaxos_lang=en
		set vabaxos_lang_params="vabaxos.lang=en locales=en_US.UTF-8 keyboard-layouts=us"
		export vabaxos_lang vabaxos_lang_params
		configfile /boot/grub/grub.cfg
	}

	menuentry "Italiano  (I)" --hotkey=i {
		set vabaxos_lang=it
		set vabaxos_lang_params="vabaxos.lang=it locales=it_IT.UTF-8 keyboard-layouts=it"
		export vabaxos_lang vabaxos_lang_params
		configfile /boot/grub/grub.cfg
	}
}

submenu "${t_tools}" --hotkey=t --id=vabaxos-tools {
	source /boot/grub/theme.cfg

	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "${t_check}" --hotkey=c {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@ vabaxos.voice=on ${vabaxos_lang_params}
			initrd	@INITRD_LIVE@
		}
	fi

	# For graphics cards that show a black screen: no kernel mode setting.
	menuentry "${t_safe}" --hotkey=g {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ vabaxos.voice=on nomodeset ${vabaxos_lang_params}
		initrd	@INITRD_LIVE@
	}

	# Leave GRUB: the firmware starts the next boot device, usually the disk.
	menuentry "${t_next}" --hotkey=d {
		exit
	}

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "${t_firmware}" --hotkey=f {
			fwsetup
		}
	fi

	menuentry "${t_reboot}" --hotkey=r {
		reboot
	}

	menuentry "${t_halt}" --hotkey=s {
		halt
	}
}
