# VabaxOS boot menu (ADR-0014), for UEFI and BIOS.
# Replaces live-build's grub.cfg; live-build fills in the @...@ markers.
#
# Accessibility: config.cfg plays two beeps when the menu is ready.
# Every entry has a letter (hotkey) that starts it at once, so the menu
# can be used without seeing it. Without a key press, the first entry
# starts after the timeout set in config.cfg. The keys are described in
# docs/utente/menu-di-avvio.md: keep the two in sync.
#
# Labels are bilingual, English first as in other distributions, then
# Italian. Hotkeys are chosen to make sense in both languages:
# V voice/voce, N no voice, R recovery/recupero, T tools, C check,
# G graphics/grafica, D disk/disco, F firmware, R reboot/riavvia (inside
# Tools), S shut down/spegni.
#
# vabaxos.voice=on|off is read by the live system to start the speech
# (console and desktop) or not.

source /boot/grub/config.cfg

menuentry "VabaxOS with voice / con voce  (V)" --hotkey=v --id=vabaxos-voice {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ vabaxos.voice=on
	initrd	@INITRD_LIVE@
}

menuentry "VabaxOS without voice / senza voce  (N)" --hotkey=n --id=vabaxos-novoice {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ vabaxos.voice=off
	initrd	@INITRD_LIVE@
}

# Recovery: text console only, no graphical session, speech on.
menuentry "Recovery mode with voice / Modalità di recupero con voce  (R)" --hotkey=r --id=vabaxos-recovery {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ vabaxos.voice=on systemd.unit=multi-user.target
	initrd	@INITRD_LIVE@
}

submenu "Tools / Strumenti  (T)" --hotkey=t --id=vabaxos-tools {
	source /boot/grub/theme.cfg

	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Check the boot medium / Verifica il supporto di avvio  (C)" --hotkey=c {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@ vabaxos.voice=on
			initrd	@INITRD_LIVE@
		}
	fi

	# For graphics cards that show a black screen: no kernel mode setting.
	menuentry "Safe graphics / Grafica sicura  (G)" --hotkey=g {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ vabaxos.voice=on nomodeset
		initrd	@INITRD_LIVE@
	}

	# Leave GRUB: the firmware starts the next boot device, usually the disk.
	menuentry "Boot from the next device / Avvia dal dispositivo successivo  (D)" --hotkey=d {
		exit
	}

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI firmware settings / Impostazioni del firmware UEFI  (F)" --hotkey=f {
			fwsetup
		}
	fi

	menuentry "Reboot / Riavvia  (R)" --hotkey=r {
		reboot
	}

	menuentry "Shut down / Spegni  (S)" --hotkey=s {
		halt
	}
}
