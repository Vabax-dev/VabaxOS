# VabaxOS live system: console speech goes through the live user's PipeWire
# (UID 1000). Start the user manager first (vabaxos-live-audio.service, live
# only), so espeakup finds its socket at once, also in recovery mode.
[Unit]
Wants=vabaxos-live-audio.service
After=vabaxos-live-audio.service user@1000.service
