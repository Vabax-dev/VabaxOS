# VabaxOS live system: the user manager of the live user ("user", UID 1000)
# starts at boot, started by vabaxos-live-audio.service (live only), which
# the welcome and console speech pull in: one sound server from the start.
# live-config creates the user at boot: start only after it. (A linger file
# does not work here: logind reads it before the user exists.)
[Unit]
After=live-config.service
