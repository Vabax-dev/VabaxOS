# VabaxOS answers for the Debian Installer (ADR-0007, ADR-0023).
# live-build puts this file in the installer's initrds, where the installer
# reads it before the first question: it applies to every boot menu entry
# (I, K, G, T) and to the restart from the welcome (vabaxos-install).
#
# It answers only the questions a person should not need to answer. The
# ones about the person and the disk are always asked: language, country
# and keyboard (unless the boot menu or the welcome gave them), user name
# and password, time zone, which disk, and the confirmation before
# anything is written. A test preseed given with preseed/file= is read
# later and can change any of these answers (scripts/test-install.sh).

# The computer's name on the network, and no domain: two questions with
# words most people do not need to know.
d-i netcfg/get_hostname string vabaxos
d-i netcfg/get_domain string

# No root password: the first user is the administrator (sudo), as in the
# live system and in Ubuntu. Two questions fewer, and one password to
# remember instead of two.
d-i passwd/root-login boolean false

# No other installation media to scan: everything is on the VabaxOS medium.
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false

# "Use a network mirror?" stays: it has a real answer, and without a network
# its default is already no. The three questions after it (mirror country,
# mirror, proxy) get Debian's main server, the one the live system uses.
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Debian testing has no separate security and updates archives (ADR-0017).
d-i apt-setup/services-select multiselect

# The choices made before installing go to the installed system, where the
# welcome begins from them at the first start (ADR-0023): the accessibility
# settings and voice speed from the welcome (vabaxos.a11y, vabaxos.rate),
# the high contrast of the boot menu entry K (theme=dark), and the language
# of the installation.
d-i preseed/late_command string \
    mkdir -p /target/var/lib/vabaxos; \
    { for word in $(cat /proc/cmdline); do \
        case "$word" in \
            vabaxos.a11y=*|vabaxos.rate=*) echo "$word" ;; \
            theme=dark) echo vabaxos.a11y=high-contrast ;; \
        esac; \
      done; \
      lang="$(debconf-get debian-installer/language)"; \
      lang="${lang%%:*}"; \
      echo "vabaxos.lang=${lang%%_*}"; \
    } > /target/var/lib/vabaxos/installer-choices
