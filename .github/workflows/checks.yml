name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reuse:
    name: Licenses (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  shell:
    name: Shell scripts and Debian packages
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends shellcheck
      - name: ShellCheck
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck
          shellcheck image/auto/config
          shellcheck packages/*/postinst packages/*/postrm packages/*/root/usr/libexec/vabaxos/*
      - name: Every workstation package exists in Debian trixie
        run: |
          grep -Ev '^[[:space:]]*(#|$)' scripts/postazione/pacchetti-debian.txt \
            | xargs apt-get install --simulate -y > /dev/null

  live-build:
    name: ISO configuration (live-build)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install live-build from forky (ADR-0017)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
          bash scripts/install-live-build.sh
      - name: lb config on image/
        run: ./scripts/build.sh --config-only

  packages:
    name: VabaxOS packages and welcome tests
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build the packages
        run: ./scripts/build-packages.sh /tmp/packages
      - name: Welcome tests (no speech, no system changes)
        run: python3 tests/welcome/test_welcome.py

  powershell:
    name: PowerShell scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | Format-List | Out-String | Write-Host; $failed = $true }
            else { Write-Host "OK: $($_.Name)" }
          }
          if ($failed) { exit 1 }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost
          if ($results) { $results | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }
          Write-Host 'OK: no findings'
