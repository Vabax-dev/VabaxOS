name: ISO

# Builds the VabaxOS ISO and boots it in QEMU with the same checks as on the
# workstation, sound included (ROADMAP v0.1, work item 10). The ISO is kept
# for a week as an artifact: nightly builds are not releases (ADR-0015).
#
# It takes about 75 minutes, so it does not run by itself (Vabax's rule,
# 2026-09-26): each block's pull request has the short checks of
# checks.yml; this one is started by hand once every 4-5 blocks, on the
# branch of the last block, and the blocks go to main when it passes.

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Another date of snapshot.debian.org to try, such as 20261005T000000Z
        type: string
        default: ''
  # The weekly try of a new Debian date (snapshot.yml, ADR-0020).
  workflow_call:
    inputs:
      snapshot:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}-${{ inputs.snapshot }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    name: Build and boot the ISO
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      # Hardware virtualisation: the runner has KVM once its user may use it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # Large files of the packages (the Kokoro model), downloaded once.
      - uses: actions/cache@v4
        with:
          path: cache/downloads
          key: downloads-${{ hashFiles('packages/*/fetch') }}

      # The build needs about 20 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Try another Debian date
        if: inputs.snapshot != ''
        env:
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          [[ "$SNAPSHOT" =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || { echo "Wrong date: $SNAPSHOT"; exit 1; }
          sed -i "s/^VABAXOS_SNAPSHOT=.*/VABAXOS_SNAPSHOT=$SNAPSHOT/" image/build.conf
          grep '^VABAXOS_SNAPSHOT=' image/build.conf

      # Debian 13 with root rights, as on the workstation (ADR-0002, ADR-0013).
      - name: Build the ISO
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src debian:trixie bash -c '
            set -e
            apt-get update -q
            apt-get install -y -q --no-install-recommends git ca-certificates curl python3
            git config --global --add safe.directory /src
            CI=true ./scripts/check-deps.sh --install
            CI=true ./scripts/build.sh
          '

      - name: Boot tests
        run: |
          docker run --rm --privileged --device /dev/kvm -v "$PWD:/src" -w /src debian:trixie bash -c '
            set -e
            apt-get update -q
            apt-get install -y -q --no-install-recommends git ca-certificates python3 qemu-system-x86 ovmf procps
            failed=0
            for args in "" "--entry novoice" "--entry recovery" "--secure-boot" "--entry install" \
                "--entry welcome-install" "--secure-boot --entry welcome-install"; do
              echo "=== test-boot.sh $args"
              ./scripts/test-boot.sh $args || failed=$((failed + 1))
            done
            exit $failed
          '

      # Automatic installation on a virtual disk, then two starts from it:
      # the choices passed to the installer must reach the installed system.
      - name: Installation test
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --privileged --device /dev/kvm -v "$PWD:/src" -w /src debian:trixie bash -c '
            set -e
            apt-get update -q
            apt-get install -y -q --no-install-recommends git ca-certificates python3 qemu-system-x86 qemu-utils ovmf procps xorriso
            ./scripts/test-install.sh
          '

      - name: Keep the ISO and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vabaxos-iso-${{ github.sha }}${{ inputs.snapshot && format('-{0}', inputs.snapshot) || '' }}
          path: |
            out/*.iso
            out/SHA256SUMS
            out/manifest.txt
            out/logs/
          retention-days: 7
          if-no-files-found: warn
